name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 让仍基于旧 Node 的 composite action 在 runner 切换默认版本前使用 Node 24（见 GitHub Actions 弃用说明）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 若已在仓库 Settings → Variables 中设置 NEXT_PUBLIC_SITE_URL（如自定义域名），则优先使用
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine REPO_NAME and default site URL for Pages
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "GITHUB_PAGES=true" >> $GITHUB_ENV
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "REPO_NAME=" >> $GITHUB_ENV
            DEFAULT_SITE_URL="https://${OWNER}.github.io"
          else
            echo "REPO_NAME=$REPO" >> $GITHUB_ENV
            DEFAULT_SITE_URL="https://${OWNER}.github.io/${REPO}"
          fi
          if [ -z "${NEXT_PUBLIC_SITE_URL:-}" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$DEFAULT_SITE_URL" >> $GITHUB_ENV
          fi

      - name: Debug environment
        run: |
          echo "Repository name: ${{ github.event.repository.name }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "REPO_NAME: ${{ env.REPO_NAME }}"
          echo "GITHUB_PAGES: ${{ env.GITHUB_PAGES }}"
          echo "NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}"

      - name: Build static site
        env:
          GITHUB_PAGES: ${{ env.GITHUB_PAGES }}
          REPO_NAME: ${{ env.REPO_NAME }}
        run: npm run build

      - name: List build output
        run: |
          echo "Build output contents:"
          ls -la out/
          echo "First few files:"
          find out/ -type f | head -10

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



