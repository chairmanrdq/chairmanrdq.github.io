name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine REPO_NAME for Pages basePath
        shell: bash
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "REPO_NAME=" >> $GITHUB_ENV
            echo "GITHUB_PAGES=true" >> $GITHUB_ENV
          else
            echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV
            echo "GITHUB_PAGES=true" >> $GITHUB_ENV
          fi

      - name: Debug environment
        run: |
          echo "Repository name: ${{ github.event.repository.name }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "REPO_NAME: ${{ env.REPO_NAME }}"
          echo "GITHUB_PAGES: ${{ env.GITHUB_PAGES }}"

      - name: Build static site
        env:
          GITHUB_PAGES: ${{ env.GITHUB_PAGES }}
          REPO_NAME: ${{ env.REPO_NAME }}
        run: npm run build

      - name: List build output
        run: |
          echo "Build output contents:"
          ls -la out/
          echo "First few files:"
          find out/ -type f | head -10

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



